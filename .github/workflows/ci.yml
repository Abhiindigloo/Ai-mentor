name: MVP checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Validates gradle-wrapper.jar checksum and caches Gradle dependencies.
      - uses: gradle/actions/setup-gradle@v4

      # The action's default package list includes the removed `tools` package,
      # so the list is overridden explicitly. Keep in sync with compileSdk.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - run: npm test

      - run: npm run android:sync

      - name: Verify committed web assets match a fresh sync
        run: |
          # --porcelain also catches untracked files that the sync created.
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Android assets or web/sw.js are out of date. Run 'npm run android:sync' and commit the result."
            exit 1
          fi

      - run: ./gradlew testDebugUnitTest assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Mentor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
