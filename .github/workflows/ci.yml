name: MVP checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run sync
      - name: Verify generated web and Android assets are committed
        run: |
          # --porcelain also catches untracked files that the sync created.
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated assets are out of date. Run 'npm run sync' and commit the result."
            exit 1
          fi

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/api/requirements.txt pytest==8.3.5
      - run: python -m pytest -q
        working-directory: services/api
      - name: Verify training data is reproducible from the curriculum
        run: python training/prepare_data.py && git diff --exit-code training/train.jsonl training/eval.jsonl
      - name: Build API image
        run: docker build -f services/api/Dockerfile -t ai-mentor-api:ci .
      - name: Smoke-test the running container
        run: |
          docker run -d --name api-smoke -p 127.0.0.1:8000:8000 ai-mentor-api:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -o /dev/null http://127.0.0.1:8000/app/
          test "$(curl -fsS http://127.0.0.1:8000/v1/lessons | python -c 'import json,sys; print(len(json.load(sys.stdin)["lessons"]))')" = 15
      - name: Container logs
        if: always()
        run: docker logs api-smoke || true

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Validates gradle-wrapper.jar checksum and caches Gradle dependencies.
      - uses: gradle/actions/setup-gradle@v4

      # The action's default package list includes the removed `tools` package,
      # so the list is overridden explicitly. Keep in sync with compileSdk.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - run: ./gradlew testDebugUnitTest assembleDebug
        working-directory: apps/android

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Mentor-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
