name: MVP checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pytest==8.3.5
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test
      - run: python training/prepare_data.py && git diff --exit-code training/train.jsonl training/eval.jsonl
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p android testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Mentor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
